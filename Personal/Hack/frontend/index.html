<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Ankush</title>
    <link rel="stylesheet" href="/assets/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@900&display=swap"

<body>
    <div class="hero-section">
        <div class="container">
            <div class="ankush-title">
                <span class="ankush-big">ANKUSH</span>

            <div class="photo-grid">
                <div class="photo-item photo-1">
                    <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><style>@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}</style><rect width='200' height='200' fill='%231a1a1a'/><rect width='200' height='200' fill='url(%23g1)'/><path d='M20 50 L180 50 M20 80 L180 80 M20 110 L180 110 M20 140 L180 140' stroke='%23333' stroke-width='2'/><rect width='200' height='200' fill='rgba(255,138,190,0.1)'/><defs><linearGradient id='g1' x1='0' y1='0' x2='1' y2='0'><stop stop-color='%231a1a1a' offset='0%25'/><stop stop-color='%23333' offset='50%25'/><stop stop-color='%231a1a1a' offset='100%25'/></linearGradient></defs><rect x='0' y='0' width='200' height='200' fill='transparent' style='animation:shimmer 3s infinite linear;'/></svg>"
                        alt="Ankush Photo 1">
                </div>
                <div class="photo-item photo-2">
                    <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><style>@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}</style><rect width='200' height='200' fill='%231a1a1a'/><rect width='200' height='200' fill='url(%23g2)'/><path d='M20 50 L180 50 M20 80 L180 80 M20 110 L180 110 M20 140 L180 140' stroke='%23333' stroke-width='2'/><rect width='200' height='200' fill='rgba(161,140,209,0.1)'/><defs><linearGradient id='g2' x1='0' y1='0' x2='1' y2='0'><stop stop-color='%231a1a1a' offset='0%25'/><stop stop-color='%23444' offset='50%25'/><stop stop-color='%231a1a1a' offset='100%25'/></linearGradient></defs><rect x='0' y='0' width='200' height='200' fill='transparent' style='animation:shimmer 3s infinite linear;'/></svg>"
                        alt="Ankush Photo 2">
                </div>
            </div>

            <button class="continue-btn" onclick="goToLogin()">Continue</button>
        </div>
    </div>

    <script src="/assets/index.js"></script>
