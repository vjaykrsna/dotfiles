services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    pull_policy: if_not_present
    ports:
      - "${MONGO_PORT}:27017"
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - docker_common_network

volumes:
  mongo_data:

networks:
  docker_common_network:
    external: true
