general_settings:
  pass_raw_headers: true

router_settings:
  routing_strategy: usage-based-routing-v2
  redis_host: litellm_redis
  redis_port: 6379
  cache: true
  cache_params:
    type: redis

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  set_verbose: false
