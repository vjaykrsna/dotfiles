services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    pull_policy: if_not_present
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${LITELLM_POSTGRES_USER}:${LITELLM_POSTGRES_PASSWORD}@${LITELLM_POSTGRES_HOST}:${LITELLM_POSTGRES_PORT}/${LITELLM_POSTGRES_DB}"
      REDIS_HOST: "${LITELLM_REDIS_HOST}"
      REDIS_PORT: "${LITELLM_REDIS_PORT}"
      REDIS_PASSWORD: "${LITELLM_REDIS_PASSWORD}"
      LITELLM_MODE: "PRODUCTION"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
 internal:
    driver: bridge
