version: "3.8"

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    pull_policy: always
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${LITELLM_POSTGRES_USER}:${LITELLM_POSTGRES_PASSWORD}@${LITELLM_POSTGRES_HOST}:${LITELLM_POSTGRES_PORT}/${LITELLM_POSTGRES_DB}"
      REDIS_HOST: "${LITELLM_REDIS_HOST}"
      REDIS_PORT: "${LITELLM_REDIS_PORT}"
      REDIS_PASSWORD: "${LITELLM_REDIS_PASSWORD}"
      LITELLM_MODE: "PRODUCTION"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"
    depends_on:
      litellm_db:
        condition: service_healthy
      litellm_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal

  litellm_db:
    image: postgres:16.1
    container_name: litellm_db
    restart: always
    pull_policy: if_not_present
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${LITELLM_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${LITELLM_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${LITELLM_POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  litellm_redis:
    image: redis/redis-stack:latest
    container_name: litellm_redis
    restart: always
    pull_policy: if_not_present
    volumes:
      - redis_data:/data
    env_file:
      - .env
    command: redis-server --requirepass ${LITELLM_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LITELLM_REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
